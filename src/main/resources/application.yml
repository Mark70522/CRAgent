# Internal defaults. Do NOT edit for your company: put everything company-specific in ./cr-agent.yml
# (see cr-agent.example.yml). Paths are relative to the working directory (run.bat sets it to the project folder).

spring:
  config:
    import:
      - optional:file:./cr-agent.yml
      - optional:file:${CR_AGENT_CONFIG:${user.home}/.cr-agent/cr-agent.yml}
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        name: cr-agent
        version: 0.2.0
        type: SYNC
        stdio: true

# File only: stdout is the MCP protocol channel (see logback-spring.xml).
logging:
  file:
    name: ./logs/cr-agent.log

cr:
  knowledge-dir: ./knowledge

cockpit:
  dir: ./cockpit
  port: 7777
  web: true

inventory:
  file: ./knowledge/inventory.xlsx
  sheet: ""
  maintenance-window: "Sun 00:00-06:00"

# ServiceNow: nothing here; describe your interfaces in cr-agent.yml (servicenow.endpoints).
servicenow:
  timeout-ms: 30000
