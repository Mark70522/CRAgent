# ============================================================================
#  cr-agent 唯一要改的配置文件。复制成 cr-agent.yml(已 gitignore),按你们的情况填。
#  密码 / token 不写在这里: 用环境变量 SN_TOKEN 或 SN_PASSWORD(setx 后重启 IntelliJ)。
# ============================================================================

servicenow:
  # 两种实现, 二选一:
  #   yaml    = 不写 Java, 下面 endpoints 里描述三个接口(默认)
  #   company = 自己在 CompanyServiceNowClient.java 里实现三个方法(认证、HTTP、报错已经做好)
  client: yaml
  base-url: https://sn-gateway.company.internal        # 你们接口的根地址
  auth:
    type: bearer                 # bearer | basic | none
    token-env: SN_TOKEN          # bearer: 从哪个环境变量读 token
    # type: basic
    # user: svc_cr_agent
    # password-env: SN_PASSWORD
  # headers:                     # 每个请求都带的额外头, 比如网关 key
  #   X-Api-Key: "..."
  # proxy-host: proxy.company.com
  # proxy-port: 8080

  # ---- 三个接口: 读 / 创建 / 更新。名字固定, 内容按你们的接口填。
  #      ${xxx} 是占位符, 来自调用时的参数: path / query / headers 里按文本替换, body 里按 JSON 替换。
  #      result 是返回 JSON 里记录所在的位置(点分隔), 空 = 整个返回。
  endpoints:
    get-change:                  # 参数: number
      method: GET
      path: /change/${number}
      result: data               # 比如返回 {"data": {...}} 就写 data
      tasks: tasks               # 记录里 task 列表所在的键(可选, 给页面和校验用)
    create-change:               # 参数: fields(草稿全部字段的对象), tasks(数组), 以及每个字段单独的 ${字段名}
      method: POST
      path: /change
      # body 不写 = 草稿字段平铺成 JSON 发出去。接口有外层包装就写模板, 例如:
      # body: '{"request": ${fields}, "tasks": ${tasks}}'
      result: data
    update-change:               # 参数: number, fields(要改的字段对象), 以及每个字段单独的 ${字段名}
      method: PATCH              # 或 PUT / POST, 按你们接口
      path: /change/${number}
      # body: '{"request": ${fields}}'
      result: data
    # ---- change task 三个接口, 各自独立调用(可选, 不配就是关着的)
    create-task:                 # 参数: number(CR 号), fields(task 字段对象), 以及每个字段单独的 ${字段名}
      method: POST
      path: /change/${number}/task
      result: data
    cancel-task:                 # 参数: id(task id), fields(比如 reason), 以及每个字段单独的 ${字段名}
      method: POST
      path: /task/${id}/cancel
      result: data
    close-task:                  # 参数: id, fields(比如 close_notes)
      method: POST
      path: /task/${id}/close
      result: data
  task-id-field: sys_id          # task 返回里哪个键是 task id(默认 sys_id, 找不到再试 number、id)

  # ---- 字段名对照(可选): 左边是程序内部的标准名(模板、规则、范例、页面都用它), 右边是你们接口的名字。
  #      只在接口边界改名, 发出去改成右边, 收回来改回左边。接口字段名和标准名一样就不用写。
  # field-map:
  #   short_description: title
  #   description: detail
  #   start_date: planned_start
  #   end_date: planned_end
  #   cmdb_ci: ci_name
  #   assignment_group: team

# ---- ICE: CR 还要在 ICE 里登记一份, 预留两个接口: 建 / 改。不用就整段删掉(status 会显示未配置, 工具会拒绝)。
#      写法和 servicenow 一样, 可以是另一个地址、另一套认证; 密码用自己的环境变量名, 别和 SN 的混。
