# ============================================================================
#  cr-agent 唯一要改的配置文件。复制成 cr-agent.yml(已 gitignore),按你们的情况填。
#  密码 / token 不写在这里: 用环境变量 SN_TOKEN 或 SN_PASSWORD(setx 后重启 IntelliJ)。
# ============================================================================

servicenow:
  base-url: https://sn-gateway.company.internal        # 你们接口的根地址
  auth:
    type: bearer                 # bearer | basic | none
    token-env: SN_TOKEN          # bearer: 从哪个环境变量读 token
    # type: basic
    # user: svc_cr_agent
    # password-env: SN_PASSWORD
  # headers:                     # 每个请求都带的额外头, 比如网关 key
  #   X-Api-Key: "..."
  # proxy-host: proxy.company.com
  # proxy-port: 8080

  # ---- 你们的接口, 有几个写几个。程序只认三个名字: get-change / create-change / search-changes,
  #      其他名字的接口 Copilot 可以用 sn_call 调。
  #      ${xxx} 是占位符, 来自调用时的参数: path / query 里按文本替换, body 里按 JSON 替换。
  #      result 是返回 JSON 里记录所在的位置(点分隔), 空 = 整个返回。
  endpoints:
    get-change:
      method: GET
      path: /change/${number}
      result: data               # 比如返回 {"data": {...}} 就写 data
      tasks: tasks               # 记录里 task 列表所在的键(可选, 给页面和校验用)
      description: 按单号读一张 CR
    create-change:
      method: POST
      path: /change
      # body 不写 = 把草稿字段平铺成 JSON 发出去。接口有外层包装就写模板, 例如:
      # body: '{"request": ${fields}, "tasks": ${tasks}}'
      result: data
      description: 创建 CR, 返回新单
    search-changes:              # 可选。没有就删掉, create-cr 会跳过"看相似历史"这一步
      method: GET
      path: /change
      query:
        ci: "${ci}"
        status: closed
        limit: "${limit}"
      result: data.items
      description: 按服务器查历史 CR

# ---- 服务器清单: 你们的 Excel ----
inventory:
  file: ./knowledge/inventory.xlsx     # 也支持 .csv
  sheet: ""                            # 空 = 第一个 sheet
  maintenance-window: "Sun 00:00-06:00"
  columns:                             # 表头叫什么就写什么(不分大小写, 空格/下划线随意)
    service: Service
    environment: Environment
    server: Server
    ip: IP                             # 下面四列可选
    os: OS
    owner-group: Owner Group
    maintenance-window: Maintenance Window

# ---- 日课驾驶舱 ----
cockpit:
  dir: ./cockpit
  port: 7777
  web: true                            # false = 不起页面
